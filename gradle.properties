# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
foojayResolverVersion=1.0.0

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# The published SDK version. It is the protocol contract that plugin repositories
# compile against, so it moves only when this module changes. Raise it with
# .github/scripts/bump_version.py before tagging library-v<version>.
EVILO_LIBRARY_VERSION_NAME=1.0.0
